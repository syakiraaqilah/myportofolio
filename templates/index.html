{% extends 'base.html' %}
{% block content %}

    <main>
      <section class="hero" id="profile">
        <div class="container hero-grid">
          <div class="hero-identity">
            <p class="hero-kicker">
              Computer Science &middot; Universitas Indonesia
            </p>
            <p class="hero-greetings">Hi, I'm</p>
            <h1 class="hero-name">
              <span class="hero-name__first">{{ name }}</span>
              <span class="hero-position">An IT enthusiast</span>
            </h1>
          </div>
          <div class="hero-photo">
            <div class="photo-block"></div>
            <img
              class="avatar"
              src="/static/img/syaki.png"
              alt="Photo of {{ name }}"
            />
          </div>
          <div class="hero-details">
            <p class="bio">
              {{ bio }}
            </p>
            <dl class="meta-list">
              <div class="meta-row">
                <dt>NPM</dt>
                <dd>{{ npm }}</dd>
              </div>
              <div class="meta-row">
                <dt>Program</dt>
                <dd>{{ study_program }}</dd>
              </div>
            </dl>
            <div class="social-links">
              <a href="https://github.com/syakiraaqilah" class="social-link"
                >GitHub</a
              >
              <a
                href="https://linkedin.com/in/syakira-aqilah-amru"
                class="social-link"
                >LinkedIn</a
              >
              <a href="mailto:syakira.aqilah.amru@gmail.com" class="social-link"
                >Email</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

{% endblock content %}
