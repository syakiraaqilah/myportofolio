<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="{% url 'main:show_main' %}" class="brand">{{ name }}'s Room</a>
        <nav>
          <a href="{% url 'main:show_main' %}" class="nav-frame nav-frame--profile">Profile</a>
          <a href="{% url 'main:show_skills' %}" class="nav-frame nav-frame--skills">Skills</a>
          <a href="{% url 'main:show_experience' %}" class="nav-frame nav-frame--experience">Experience</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="profile">
        <div class="container hero-grid">
          <div class="hero-identity">
            <p class="hero-kicker">
              Computer Science &middot; Universitas Indonesia
            </p>
            <p class="hero-greetings">Hi, I'm</p>
            <h1 class="hero-name">
              <span class="hero-name__first">{{ name }}</span>
              <span class="hero-position">An IT enthusiast</span>
            </h1>
          </div>
          <div class="hero-photo">
            <div class="photo-block"></div>
            <img
              class="avatar"
              src="/static/img/syaki.png"
              alt="Photo of {{ name }}"
            />
          </div>
          <div class="hero-details">
            <p class="bio">
              {{ bio }}
            </p>
            <dl class="meta-list">
              <div class="meta-row">
                <dt>NPM</dt>
                <dd>{{ npm }}</dd>
              </div>
              <div class="meta-row">
                <dt>Program</dt>
                <dd>{{ study_program }}</dd>
              </div>
            </dl>
            <div class="social-links">
              <a href="https://github.com/syakiraaqilah" class="social-link"
                >GitHub</a
              >
              <a
                href="https://linkedin.com/in/syakira-aqilah-amru"
                class="social-link"
                >LinkedIn</a
              >
              <a href="mailto:syakira.aqilah.amru@gmail.com" class="social-link"
                >Email</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.
        </p>
      </div>
    </footer>
  </body>
</html>
