<div id="edit-experience-modal" class="project-form-modal" popover="auto" role="dialog" aria-modal="true" aria-labelledby="edit-experience-modal-title">
    <button type="button" class="project-form-modal__backdrop" popovertarget="edit-experience-modal" popovertargetaction="hide" aria-label="Close form"></button>
    <div class="project-form-modal__content">
        <button type="button" class="project-form-modal__close" popovertarget="edit-experience-modal" popovertargetaction="hide" aria-label="Close form">×</button>
        <h2 id="edit-experience-modal-title">Edit Experience</h2>
        <form id="experience-edit-form" class="project-form">
            {% for field in form %}<div class="form-group"><label>{{ field.label }}{{ field }}</label></div>{% endfor %}
            <div class="project-form-modal__actions">
                <button type="button" class="button button-secondary" popovertarget="edit-experience-modal" popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>
